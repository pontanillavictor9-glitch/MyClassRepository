<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f6f6"/><stop offset="1" stop-color="#d3ecec"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde4ee"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fondo)"/>
  <ellipse cx="400" cy="505" rx="230" ry="26" fill="#b9d9d9"/>
  <!-- cuerpo de la fuente -->
  <path d="M250 500 Q 240 360 280 330 L 520 330 Q 560 360 550 500 Z" fill="url(#cuerpo)"/>
  <ellipse cx="400" cy="330" rx="120" ry="30" fill="#c9d3e2"/>
  <ellipse cx="400" cy="330" rx="104" ry="24" fill="url(#agua)"/>
  <!-- surtidor -->
  <rect x="386" y="240" width="28" height="80" rx="12" fill="#eef1f6"/>
  <path d="M400 240 C 360 260, 340 290, 336 318" fill="none" stroke="url(#agua)" stroke-width="10" stroke-linecap="round"/>
  <path d="M400 240 C 440 260, 460 290, 464 318" fill="none" stroke="url(#agua)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="400" cy="236" r="10" fill="#38bdf8"/>
  <!-- gotas y detalles -->
  <circle cx="340" cy="290" r="5" fill="#7dd3fc"/>
  <circle cx="462" cy="284" r="5" fill="#7dd3fc"/>
  <circle cx="330" cy="450" r="7" fill="#4f46e5" opacity="0.25"/>
  <path d="M310 430 q 6 -12 12 0 q -6 12 -12 0" fill="#38bdf8" opacity="0.6"/>
  <!-- huella decorativa -->
  <g fill="#9db8b8" transform="translate(590,150) scale(0.9)">
    <ellipse cx="0" cy="18" rx="16" ry="13"/>
    <circle cx="-18" cy="-2" r="6"/><circle cx="-6" cy="-9" r="6"/>
    <circle cx="6" cy="-9" r="6"/><circle cx="18" cy="-2" r="6"/>
  </g>
  <text x="400" y="575" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" fill="#4b6b6b">Fuente AquaMiau 1,5 L — imagen provisional (usa fotos reales)</text>
</svg>
