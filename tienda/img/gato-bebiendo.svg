<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3e7"/><stop offset="1" stop-color="#f8e8d4"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fondo)"/>
  <ellipse cx="400" cy="510" rx="270" ry="26" fill="#e6cfae"/>
  <!-- fuente pequeña -->
  <path d="M470 500 Q 462 400 490 380 L 640 380 Q 668 400 660 500 Z" fill="#eef1f6"/>
  <ellipse cx="565" cy="380" rx="75" ry="20" fill="url(#agua)"/>
  <path d="M565 320 C 540 335, 528 355, 525 372" fill="none" stroke="url(#agua)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="565" cy="316" r="8" fill="#38bdf8"/>
  <!-- gato -->
  <ellipse cx="290" cy="470" rx="120" ry="60" fill="#4a4e63"/>
  <circle cx="400" cy="400" r="55" fill="#4a4e63"/>
  <polygon points="360,360 375,320 395,355" fill="#4a4e63"/>
  <polygon points="440,360 425,320 405,355" fill="#4a4e63"/>
  <polygon points="366,355 376,332 390,352" fill="#f8b4c0"/>
  <polygon points="434,355 424,332 410,352" fill="#f8b4c0"/>
  <!-- cara inclinada hacia el agua -->
  <circle cx="385" cy="398" r="6" fill="#1c1c22"/>
  <circle cx="420" cy="398" r="6" fill="#1c1c22"/>
  <path d="M395 418 q 7 6 14 0" fill="none" stroke="#1c1c22" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="402" cy="414" rx="5" ry="4" fill="#f8b4c0"/>
  <!-- lengua hacia el chorro -->
  <path d="M412 424 Q 450 440 500 372" fill="none" stroke="#f8b4c0" stroke-width="8" stroke-linecap="round"/>
  <!-- cola -->
  <path d="M180 470 Q 130 420 160 370" fill="none" stroke="#4a4e63" stroke-width="22" stroke-linecap="round"/>
  <text x="400" y="575" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" fill="#8a6d4a">A los gatos les encanta el agua en movimiento</text>
</svg>
