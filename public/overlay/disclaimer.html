<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay · Aviso legal</title>
<style>
  body { margin: 0; background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  .banner {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(10, 14, 24, 0.9);
    border: 1px solid rgba(255, 196, 0, 0.35);
    border-left: 5px solid #ffc400;
    border-radius: 10px;
    padding: 10px 16px;
    color: #f2f5fa;
    max-width: 860px;
  }
  .tag {
    flex-shrink: 0;
    background: rgba(255, 196, 0, 0.15);
    color: #ffc400;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .text { font-size: 15px; line-height: 1.35; opacity: 1; transition: opacity .5s; }
  .text.fade { opacity: 0; }
</style>
</head>
<body>
  <div class="banner">
    <span class="tag">AVISO</span>
    <span class="text" id="text">Este contenido es únicamente entretenimiento. No es asesoramiento financiero.</span>
  </div>

<script src="/js/live.js"></script>
<script>
  // Rota entre los disclaimers configurados cada 12 segundos
  let frases = [];
  let i = 0;
  const el = document.getElementById('text');

  function rotar() {
    if (!frases.length) return;
    el.classList.add('fade');
    setTimeout(() => {
      i = (i + 1) % frases.length;
      el.textContent = frases[i];
      el.classList.remove('fade');
    }, 500);
  }

  Live.connect({
    onConfig: c => {
      if (c.disclaimers && c.disclaimers.length) {
        frases = c.disclaimers;
        el.textContent = frases[0];
      }
    }
  });
  setInterval(rotar, 12000);
</script>
</body>
</html>
